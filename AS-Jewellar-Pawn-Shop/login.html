<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Login &bull; AS Jewellar Pawn Shop</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: radial-gradient(circle at 50% 20%, #FFFDF9 0%, #F1F5F9 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(180deg, var(--slate-900) 0%, #1E293B 100%);
      padding: var(--space-6) var(--space-6) var(--space-5);
      text-align: center;
      color: #FFFFFF;
    }
    .login-brand-logo {
      display: flex;
      justify-content: center;
      margin-bottom: var(--space-3);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Language Switcher Header -->
    <div style="margin-bottom:var(--space-4); display:flex; justify-content:flex-end; width:100%; max-width:420px;">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="ta">தமிழ்</button>
      </div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-header">
        <div class="login-brand-logo">
          <svg width="60" height="60" viewBox="0 0 80 80" fill="none">
            <rect x="0" y="0" width="80" height="80" rx="16" fill="#0F172A" />
            <path d="M40 16 L62 32 L40 68 L18 32 Z" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linejoin="round" />
            <path d="M18 32 L62 32" stroke="#D4AF37" stroke-width="3" />
            <path d="M40 16 L40 68" stroke="#D4AF37" stroke-width="3" />
            <circle cx="40" cy="42" r="8" fill="#D4AF37" />
          </svg>
        </div>
        <h2 style="font-size:var(--font-size-lg); font-weight:800; color:#FFFFFF; letter-spacing:0.5px;" data-i18n="shop_name">AS JEWELLAR</h2>
        <p style="font-size:11px; color:var(--gold-400); font-weight:700; letter-spacing:1px; margin-top:2px;">PAWN SHOP &bull; அடகு கடை</p>
        <div style="font-size:var(--font-size-xs); color:var(--slate-400); margin-top:4px;" data-i18n="admin_portal">Admin Portal (நிர்வாக தளம்)</div>
      </div>

      <div class="card-body" style="padding:var(--space-6);">
        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="username">
              <span>Admin Username</span>
              <span class="required">*</span>
            </label>
            <input type="text" id="username" class="form-input" placeholder="Arockiasamy C" value="Arockiasamy C" required autofocus />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              <span>Password</span>
              <span class="required">*</span>
            </label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" value="AS@2026" required />
            
          </div>

          <div id="loginError" class="alert alert-danger" style="display:none; margin-top:var(--space-3); padding:var(--space-2) var(--space-3);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="loginErrorMsg">Invalid username or password</span>
          </div>

          <div style="margin-top:var(--space-5);">
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
              <span data-i18n="admin_portal">Secure Admin Sign In</span>
            </button>
          </div>
        </form>
      </div>

      <div class="card-footer" style="background-color:var(--slate-50); justify-content:center; padding:var(--space-3);">
        <span style="font-size:11px; color:var(--slate-500);">AS Jewellar Pawn Broking Management System &bull; v1.0</span>
      </div>
    </div>
  </div>

  <!-- Core Foundation Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const errorMsg = document.getElementById('loginErrorMsg');
      const submitBtn = document.getElementById('loginSubmitBtn');

      errorDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="spinner" style="width:18px; height:18px;"></div> Authenticating...`;

      try {
        const result = await window.auth.login(user, pass);
        if (result.success) {
          window.location.replace('dashboard.html');
        } else {
          errorMsg.textContent = result.message || 'Invalid credentials';
          errorDiv.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Secure Admin Sign In</span>`;
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorDiv.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Secure Admin Sign In</span>`;
      }
    });
  </script>
</body>
</html>
