<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AS Jewellar Pawn Shop &bull; அடகு கடை</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F172A" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--bg-app);">
  <div style="text-align:center; padding:var(--space-6);">
    <div class="spinner" style="width:40px; height:40px; border-width:3px; margin-bottom:var(--space-4);"></div>
    <h2 style="font-size:var(--font-size-md); font-weight:700; color:var(--slate-800);">AS JEWELLAR PAWN SHOP</h2>
    <p class="text-muted" style="font-size:var(--font-size-xs); margin-top:4px;">Loading system foundation...</p>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.auth && window.auth.isAuthenticated()) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('login.html');
      }
    });
  </script>
</body>
</html>
